name: CI

on:
  push:
    branches: [ "2.0", "master" ]
  pull_request:
    branches: [ "2.0", "master" ]

jobs:
  build-test-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Ra3.Tools.sln

      - name: Build
        run: dotnet build Ra3.Tools.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Ra3.Tools.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack Ra3.Tools.sln --configuration Release --no-build --output artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
